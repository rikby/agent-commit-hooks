# Enforce semantic class names — block CSS-framework utility classes in markup
# P1 — requires: node OR bun (no npm dependencies)
#
# Flags Tailwind / WindiCSS / UnoCSS utility classes written directly in
# component markup (JSX/Svelte/Vue/HTML) so they can't silently shadow your
# @layer components CSS contract. See docs/semantic-classes.md for the full
# rationale, the cascade-layer hazard, and configuration.
#
# The classifier recognizes semantic classes automatically by their shape — you
# do NOT need to register your BEM/semantic names. The SEMANTIC_ALLOW env var
# below is an escape hatch for rare edge cases and stays empty by default.
#
# Mode (set via env in your project's lefthook.yml):
#
#   CONTRACT_ONLY=1  (recommended, default here) — only flag a file when it has
#                     a colocated `.css` declaring `@layer components`. High
#                     precision, zero noise on utility-heavy files without a CSS
#                     contract. Override with CONTRACT_ONLY=0 to lint every file.
#
# Escape hatches (leave empty unless you hit a specific issue):
#
#   SEMANTIC_ALLOW   regex; tokens matching it are never flagged. Rarely needed
#                     — the shape-based classifier already recognizes BEM-style
#                     and kebab-case semantic names. Only set this if a genuine
#                     project utility is being misclassified as semantic.
#   UTILITY_ALLOW    regex; tokens matching it are always treated as a utility.
#                     Use for project-specific utilities not in the built-in set.

pre-commit:
  scripts:
    "enforce-semantic-classes.sh":
      runner: sh
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,svelte,vue,html,htm,php,astro}"
      env:
        CONTRACT_ONLY: "1"
        SEMANTIC_ALLOW: ""
